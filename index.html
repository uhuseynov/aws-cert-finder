<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AWS Cert Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Answer a few questions and get the AWS certification that fits you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: navy console band on top, one narrow working column below; the quiz is a stack of answer rows, the result is a two-step path. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #16202c;
  --muted: #566476;
  --line: #d6dde6;
  --band: #16202c;
  --band-ink: #f3f6f9;
  --band-muted: #a9b6c5;
  --accent: #ff9900;
  --accent-ink: #16202c;
  --link: #a04f00;
  --hover: #fff4e3;
  --focus: #0b6bcb;
  --lvl-foundational: #0f766e;
  --lvl-associate: #1d5fbf;
  --lvl-professional: #6d3fc0;
  --lvl-specialty: #b42346;
  --lvl-business: #9a5b00;

  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141c; --surface: #16212d; --ink: #e8edf3; --muted: #9caabb; --line: #2a3a4b;
    --band: #0a1017; --band-ink: #f3f6f9; --band-muted: #93a3b5;
    --accent: #ff9900; --accent-ink: #16202c; --link: #ffb54d; --hover: #1f2d3c; --focus: #6cb2ff;
    --lvl-foundational: #3cc4b5; --lvl-associate: #6aa6ff; --lvl-professional: #b392ff;
    --lvl-specialty: #ff7c98; --lvl-business: #f0b357;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141c; --surface: #16212d; --ink: #e8edf3; --muted: #9caabb; --line: #2a3a4b;
  --band: #0a1017; --band-ink: #f3f6f9; --band-muted: #93a3b5;
  --accent: #ff9900; --accent-ink: #16202c; --link: #ffb54d; --hover: #1f2d3c; --focus: #6cb2ff;
  --lvl-foundational: #3cc4b5; --lvl-associate: #6aa6ff; --lvl-professional: #b392ff;
  --lvl-specialty: #ff7c98; --lvl-business: #f0b357;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.55 var(--body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.wrap {
  width: 100%;
  max-width: 44rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header band */
.band { background: var(--band); color: var(--band-ink); }
.band .wrap { padding-block: 1.1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: .65rem; min-width: 0; }
.brand-mark {
  width: 2rem; height: 2rem; flex: none; border-radius: 7px;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center;
  font: 800 .95rem/1 var(--display);
}
.brand-name { font: 600 1rem/1.2 var(--display); letter-spacing: .01em; }
.brand-sub { font-size: .78rem; color: var(--band-muted); }
.band-tag { font: 500 .72rem/1 var(--mono); color: var(--band-muted); letter-spacing: .06em; text-transform: uppercase; }

main { flex: 1; }
main .wrap { padding-block: 2.25rem 3rem; }

h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
h1 { font-weight: 800; font-size: clamp(2rem, 6vw, 2.9rem); line-height: 1.05; letter-spacing: -.02em; }
h2 { font-weight: 800; font-size: clamp(1.45rem, 4.4vw, 1.9rem); line-height: 1.15; letter-spacing: -.01em; }
h3 { font-weight: 600; font-size: 1.15rem; line-height: 1.25; }
p { margin: 0; }
.lede { color: var(--muted); font-size: 1.08rem; max-width: 34rem; }
a { color: var(--link); text-underline-offset: 2px; }

.eyebrow { font: 500 .74rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Buttons */
button { font: inherit; color: inherit; }
.btn {
  display: inline-flex; align-items: center; gap: .5rem;
  border: 0; border-radius: 999px; cursor: pointer;
  padding: .8rem 1.4rem; font-weight: 600;
  background: var(--accent); color: var(--accent-ink);
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:hover { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn:active { transform: translateY(1px); }
.btn-quiet {
  background: transparent; color: var(--ink);
  border: 1px solid var(--line); padding: .55rem 1rem; font-weight: 500;
}
.btn-quiet:hover { box-shadow: none; background: var(--hover); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }

/* Start screen */
.start { display: grid; gap: 1.5rem; }
.facts { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; color: var(--muted); font-size: .92rem; }
.facts b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.ladder { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5rem; margin-top: .5rem; }
.rung {
  border-top: 3px solid var(--c); padding-top: .55rem;
  font-size: .82rem; color: var(--muted); min-width: 0;
}
.rung strong { display: block; color: var(--ink); font: 600 .9rem/1.2 var(--display); }

/* Question */
.q-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
.trail { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0 0 1.25rem; padding: 0; list-style: none; }
.trail li {
  font-size: .8rem; color: var(--muted); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: .2rem .65rem;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.options { display: grid; gap: .6rem; margin-top: 1.5rem; }
.option {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1rem 1.1rem; font-size: 1.02rem; line-height: 1.4;
  transition: border-color .12s ease, background .12s ease;
}
@media (hover: hover) { .option:hover { border-color: var(--accent); background: var(--hover); } }
.option:active { border-color: var(--accent); }
.option .key {
  flex: none; font: 500 .75rem/1 var(--mono); color: var(--muted);
  border: 1px solid var(--line); border-radius: 5px; padding: .3rem .45rem;
}
.option span:first-child { min-width: 0; }
.nav { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1.5rem; }

/* Result */
.result { display: grid; gap: 1.75rem; }
.chip {
  display: inline-flex; align-items: center; gap: .4rem;
  font: 500 .72rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  background: color-mix(in srgb, var(--c) 10%, transparent);
  border-radius: 999px; padding: .35rem .6rem;
}
.lvl-Foundational { --c: var(--lvl-foundational); }
.lvl-Associate { --c: var(--lvl-associate); }
.lvl-Professional { --c: var(--lvl-professional); }
.lvl-Specialty { --c: var(--lvl-specialty); }
.lvl-Business { --c: var(--lvl-business); }

.pick {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 1.5rem; display: grid; gap: .9rem;
  box-shadow: 0 1px 0 var(--line), 0 12px 28px -18px rgba(10, 20, 30, .35);
}
.pick-top { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
.meta { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; font-size: .9rem; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.why { border-left: 3px solid var(--accent); padding-left: .9rem; }
.why .eyebrow { display: block; margin-bottom: .35rem; }
.note { font-size: .88rem; color: var(--muted); }

.path { display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr); gap: .9rem; }
.step-dot {
  width: 2.25rem; height: 2.25rem; border-radius: 50%;
  display: grid; place-items: center; font: 500 .85rem/1 var(--mono);
  background: var(--accent); color: var(--accent-ink);
}
.step.then .step-dot { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.step-line { width: 2px; height: 1.25rem; background: var(--line); margin-left: calc(1.125rem - 1px); }
.step-body { padding-top: .35rem; display: grid; gap: .4rem; min-width: 0; padding-bottom: .25rem; }
.step-body .eyebrow { font-size: .68rem; }

.recap { border-top: 1px solid var(--line); padding-top: 1.25rem; display: grid; gap: .75rem; }
.recap ol { margin: 0; padding-left: 1.2rem; display: grid; gap: .4rem; color: var(--muted); font-size: .92rem; }
.recap ol b { color: var(--ink); font-weight: 600; }

footer { border-top: 1px solid var(--line); }
footer .wrap { padding-block: 1.25rem 1.5rem; font-size: .82rem; color: var(--muted); display: grid; gap: .35rem; }

.view { animation: rise .22s ease-out both; }
@keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } .btn, .option { transition: none; } }

@media (max-width: 520px) {
  .ladder { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pick { padding: 1.15rem; }
  .option .key { display: none; }
}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">CF</div>
      <div>
        <div class="brand-name">AWS Cert Finder</div>
        <div class="brand-sub">AWS Student Builder Group · Constructor University</div>
      </div>
    </div>
    <div class="band-tag" id="updated"></div>
  </div>
</header>

<main>
  <div class="wrap" id="app" aria-live="polite">
    <p class="lede">Loading questions…</p>
  </div>
</main>

<footer>
  <div class="wrap">
    <p id="disclaimer">Not an official AWS tool. Check the official AWS page before booking an exam.</p>
    <p id="resources"></p>
  </div>
</footer>

<!-- Optional settings (stats API URL). Missing file = stats switched off. -->
<script src="config.js"></script>
<!-- If this tag contains JSON, it is used instead of fetching data/tree.json. -->
<script id="tree-data" type="application/json"></script>
<script>
(function () {
  "use strict";
  var config = window.CERT_FINDER_CONFIG || {};
  var app = document.getElementById("app");
  var LADDER = [
    { level: "Foundational", text: "Cloud & AI basics" },
    { level: "Associate", text: "Role-based skills" },
    { level: "Professional", text: "Advanced, 2+ years" },
    { level: "Specialty", text: "Deep in one domain" }
  ];

  var tree = null;
  var history = [];      // [{ node: id, answer: label }]
  var current = null;    // current node id
  var resultSent = false;

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return node;
  }

  function show(view) {
    app.replaceChildren(view);
    view.classList.add("view");
    var heading = view.querySelector("h1, h2");
    if (heading) { heading.setAttribute("tabindex", "-1"); heading.focus({ preventScroll: true }); }
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function levelChip(level) {
    return el("span", { class: "chip lvl-" + level, text: level });
  }

  function priceText(cert) {
    if (cert.price_usd) return "$" + cert.price_usd;
    return cert.status === "beta" ? "Beta exam" : "See AWS page";
  }

  /* ---------- views ---------- */

  // Shortest and longest number of questions from `id` to a result (the tree may share nodes).
  function questionRange(id, memo) {
    memo = memo || {};
    if (memo[id]) return memo[id];
    var node = tree.nodes[id];
    if (node.type !== "question") return (memo[id] = [0, 0]);
    var lo = Infinity, hi = 0;
    node.options.forEach(function (o) {
      var r = questionRange(o.next, memo);
      lo = Math.min(lo, r[0] + 1);
      hi = Math.max(hi, r[1] + 1);
    });
    return (memo[id] = [lo, hi]);
  }

  function renderStart() {
    var certCount = Object.keys(tree.certs).length;
    var range = questionRange(tree.start);
    var rangeText = range[0] === range[1] ? String(range[0]) : range[0] + "–" + range[1];
    var ladder = el("div", { class: "ladder", "aria-label": "AWS certification levels" },
      LADDER.map(function (r) {
        return el("div", { class: "rung lvl-" + r.level }, [el("strong", { text: r.level }), r.text]);
      }));
    show(el("section", { class: "start" }, [
      el("p", { class: "eyebrow", text: "Find your first (or next) AWS certification" }),
      el("h1", { text: tree.meta.title }),
      el("p", { class: "lede", text: tree.meta.subtitle }),
      el("div", { class: "facts" }, [
        el("span", {}, [el("b", { text: rangeText }), " questions"]),
        el("span", {}, [el("b", { text: String(certCount) }), " certifications covered"]),
        el("span", {}, [el("b", { text: "1–2" }), " minutes"])
      ]),
      el("div", {}, [el("button", { class: "btn", type: "button", id: "start-btn", onclick: function () { go(tree.start); } }, ["Start", el("span", { "aria-hidden": "true", text: "→" })])]),
      ladder
    ]));
  }

  function renderQuestion(id) {
    var node = tree.nodes[id];
    var options = el("div", { class: "options", role: "group", "aria-label": "Answers" },
      node.options.map(function (opt, i) {
        return el("button", {
          class: "option", type: "button", id: "opt-" + id + "-" + i,
          onclick: function () { answer(id, opt); }
        }, [el("span", { text: opt.label }), el("span", { class: "key", "aria-hidden": "true", text: String(i + 1) })]);
      }));

    var trail = history.length ? el("ul", { class: "trail", "aria-label": "Your answers so far" },
      history.map(function (h) { return el("li", { text: h.answer, title: h.answer }); })) : null;

    show(el("section", {}, [
      el("div", { class: "q-head" }, [el("span", { class: "eyebrow", text: "Question " + (history.length + 1) })]),
      trail,
      el("h2", { text: node.text }),
      options,
      el("div", { class: "nav" }, [
        el("button", { class: "btn btn-quiet", type: "button", id: "back-btn", onclick: back }, ["← Back"]),
        history.length ? el("button", { class: "btn btn-quiet", type: "button", id: "restart-btn", onclick: restart }, ["Start over"]) : null
      ])
    ]));
  }

  function certBlock(cert) {
    var rows = [
      el("div", { class: "pick-top" }, [levelChip(cert.level), cert.status === "beta" ? el("span", { class: "chip lvl-Business", text: "Beta" }) : null]),
      el("h3", { text: cert.name }),
      el("p", { text: cert.summary }),
      el("div", { class: "meta" }, [
        el("span", {}, ["Exam: ", el("b", { text: priceText(cert) })]),
        el("span", {}, ["Good for: ", el("b", { text: cert.good_for })])
      ])
    ];
    if (cert.note) rows.push(el("p", { class: "note", text: cert.note }));
    rows.push(el("a", { href: cert.url, target: "_blank", rel: "noopener", text: "Official exam page ↗" }));
    return rows;
  }

  function renderResult(id) {
    var node = tree.nodes[id];
    var primary = tree.certs[node.primary];
    var next = node.next_step ? tree.certs[node.next_step] : null;

    var pick = el("article", { class: "pick" }, certBlock(primary).concat([
      el("div", { class: "why" }, [el("span", { class: "eyebrow", text: "Why this fits you" }), el("p", { text: node.reason })])
    ]));

    var path = el("div", { class: "path" }, [
      el("div", { class: "step" }, [
        el("div", { class: "step-dot", "aria-hidden": "true", text: "1" }),
        el("div", { class: "step-body" }, [el("span", { class: "eyebrow", text: "Start here" }), pick])
      ])
    ]);
    if (next) {
      path.appendChild(el("div", { class: "step-line", "aria-hidden": "true" }));
      path.appendChild(el("div", { class: "step then" }, [
        el("div", { class: "step-dot", "aria-hidden": "true", text: "2" }),
        el("div", { class: "step-body" }, [
          el("span", { class: "eyebrow", text: "Then" }),
          el("div", { class: "pick-top" }, [levelChip(next.level)]),
          el("h3", { text: next.name }),
          el("p", { class: "note", text: next.summary }),
          el("a", { href: next.url, target: "_blank", rel: "noopener", text: "Official exam page ↗" })
        ])
      ]));
    }

    var recap = el("section", { class: "recap" }, [
      el("span", { class: "eyebrow", text: "Your answers" }),
      el("ol", {}, history.map(function (h) {
        return el("li", {}, [tree.nodes[h.node].text + " ", el("b", { text: h.answer })]);
      })),
      el("div", { class: "nav" }, [
        el("button", { class: "btn", type: "button", id: "again-btn", onclick: restart }, ["Start over"]),
        el("button", { class: "btn btn-quiet", type: "button", id: "result-back-btn", onclick: back }, ["← Change last answer"])
      ])
    ]);

    show(el("section", { class: "result" }, [
      el("div", {}, [
        el("p", { class: "eyebrow", text: "Your recommendation" }),
        el("h2", { text: primary.short_name })
      ]),
      path,
      recap
    ]));
    sendResult(node.primary);
  }

  /* ---------- navigation ---------- */

  function go(id) {
    current = id;
    var node = tree.nodes[id];
    if (node.type === "question") renderQuestion(id);
    else renderResult(id);
  }

  function answer(id, opt) {
    history.push({ node: id, answer: opt.label });
    go(opt.next);
  }

  function back() {
    var last = history.pop();
    if (last) go(last.node);
    else { current = null; renderStart(); }
  }

  function restart() {
    history = [];
    current = null;
    resultSent = false;
    renderStart();
  }

  document.addEventListener("keydown", function (e) {
    if (!tree || !current || tree.nodes[current].type !== "question") return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var n = parseInt(e.key, 10);
    var opts = tree.nodes[current].options;
    if (n >= 1 && n <= opts.length) { e.preventDefault(); answer(current, opts[n - 1]); }
    else if (e.key === "Backspace") { e.preventDefault(); back(); }
  });

  /* ---------- live stats (optional, never blocks the page) ---------- */

  function apiBase() {
    var url = (config.statsApiUrl || "").trim();
    if (!url) return "";
    return url.charAt(url.length - 1) === "/" ? url : url + "/";
  }

  function sendResult(certId) {
    var base = apiBase();
    if (!base || resultSent) return;
    resultSent = true;
    try {
      fetch(base + "result", {
        method: "POST",
        // text/plain keeps this a "simple" CORS request (no preflight), which also
        // works with keepalive in every browser. The API parses the body as JSON.
        headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: JSON.stringify({ cert: certId }),
        keepalive: true
      }).catch(function () { /* stats are optional */ });
    } catch (e) { /* stats are optional */ }
  }

  /* ---------- boot ---------- */

  function boot(data) {
    tree = data;
    document.getElementById("updated").textContent = "Data checked " + data.meta.updated;
    document.getElementById("disclaimer").textContent = "Not an official AWS tool. " + data.meta.disclaimer + " " + data.meta.price_note;
    var res = document.getElementById("resources");
    data.meta.resources.forEach(function (r, i) {
      if (i) res.appendChild(document.createTextNode(" · "));
      res.appendChild(el("a", { href: r.url, target: "_blank", rel: "noopener", text: r.label }));
    });
    renderStart();
  }

  function fail(err) {
    app.replaceChildren(el("div", { class: "start" }, [
      el("h2", { text: "Couldn't load the questions" }),
      el("p", { class: "lede", text: "The page needs data/tree.json next to it. If you opened this file directly from your disk, run the local server instead: python scripts/dev_server.py, then open http://localhost:8000." }),
      el("p", { class: "note", text: String(err) })
    ]));
  }

  var embedded = document.getElementById("tree-data").textContent.trim();
  if (embedded) {
    try { boot(JSON.parse(embedded)); } catch (e) { fail(e); }
  } else {
    fetch(config.treeUrl || "data/tree.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status + " for tree.json"); return r.json(); })
      .then(boot)
      .catch(fail);
  }
})();
</script>
</body>
</html>
